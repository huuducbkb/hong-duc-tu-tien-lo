<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HỒNG ĐỨC TU TIÊN LỘ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: #f3e6c4;
      color: #29251e;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { max-width: 48rem; }
    h1 { font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1.18; margin: 0 0 1.5rem; }
    p { font-size: clamp(1.1rem, 3vw, 1.4rem); line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>HỒNG ĐỨC TU TIÊN LỘ</h1>
    <p>Đang xây dựng lại từ đầu - phiên bản mới sắp ra mắt</p>
  </main>
</body>
</html>
