<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm thử lịch cách ly</title><h1>Hồi quy lịch tám năm — mạng giả</h1><p>Chỉ origin thử riêng; cấm LIVE. Không nhập khóa hay save thật.</p><pre id="out">Đang tải nguồn công khai…</pre><a id="download" hidden>Tải kết quả JSON</a><script>
(async()=>{'use strict';
if(location.hostname==='huuducbkb.github.io')throw Error('Cấm test trên LIVE');
const commit=new URLSearchParams(location.search).get('commit')||'a881ba6b9a412beec82c60e1e15d4723e8dd7ede';
if(!/^[a-f0-9]{40}$/.test(commit))throw Error('Cần SHA đầy đủ');
const files=['index.html','css/giao-dien.css','js/thoi-gian.js','js/man-hinh.js','js/muc-luc.js','js/khoi-thanh.js','js/luu-tru.js','js/openrouter.js','js/gemini.js','js/truyen-ke.js','test/bo-hoi-quy-phat-hanh.js','test/thoi-gian.js','test/ke-hoach-lich.js'];
const sources={},hashes={};for(const p of files){const r=await fetch('https://raw.githubusercontent.com/huuducbkb/hong-duc-tu-tien-lo/'+commit+'/'+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);sources[p]=await r.text();hashes[p]=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(sources[p]))),x=>x.toString(16).padStart(2,'0')).join('')}
const tag=t=>'<script>'+t.replace(/<\/script/gi,'<\\/script')+'</'+'script>';
const boot=`window.__HONGDUC_TEST_ISOLATED__=true;window.fetch=async()=>{throw Error('Mạng thật bị khóa')};const memory=new Map();Storage.prototype.getItem=function(k){return memory.has(String(k))?memory.get(String(k)):null};Storage.prototype.setItem=function(k,v){memory.set(String(k),String(v))};Storage.prototype.removeItem=function(k){memory.delete(String(k))};Storage.prototype.clear=function(){memory.clear()};Storage.prototype.key=function(i){return [...memory.keys()][i]??null};Object.defineProperty(Storage.prototype,'length',{get(){return memory.size}});document.addEventListener('DOMContentLoaded',()=>{window.testDb='cach-ly-lich-'+Math.random().toString(36).slice(2);HongDuc.so.dbName=testDb;HongDuc.so.refresh=async()=>{}},{once:true});window.addEventListener('boba-regression-result',async e=>{try{const r=JSON.parse(e.detail);r.core=HongDuc.testThoiGian();r.helper=HongDuc.testKeHoachLich();r.integration=await HongDuc.testTichHopLich();const d=document,p=d.getElementById('profile-data'),b=d.getElementById('toc-toggle'),a=p.getBoundingClientRect(),c=b.getBoundingClientRect();r.mobile={width:innerWidth,height:innerHeight,profile:{x:a.x,y:a.y,width:a.width,height:a.height},close:{x:c.x,y:c.y,width:c.width,height:c.height},overlap:a.left<c.right&&a.right>c.left&&a.top<c.bottom&&a.bottom>c.top,overflow:d.documentElement.scrollWidth>innerWidth};await new Promise((resolve,reject)=>{const q=indexedDB.deleteDatabase(testDb);q.onsuccess=resolve;q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('Kho thử chưa đóng'))});parent.postMessage({type:'release-result',data:r},'*')}catch(e){parent.postMessage({type:'release-error',message:String(e)},'*')}});window.addEventListener('error',e=>parent.postMessage({type:'release-error',message:e.message},'*'));window.addEventListener('unhandledrejection',e=>parent.postMessage({type:'release-error',message:String(e.reason)},'*'));`;
let base=sources['index.html'].replace(/<script\b[^>]*src="([^"]+)"[^>]*><\/script>/gi,(m,p)=>{if(!sources[p])throw Error('Thiếu '+p);return tag(sources[p])}).replace(/<link\b[^>]*>/gi,'');
base=base.replace('<head>','<head><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' \'unsafe-eval\'; style-src \'unsafe-inline\'; connect-src \'none\'; img-src \'none\'">'+tag(boot)+'<style>'+sources['css/giao-dien.css']+'</style>');
base=base.replace('</body>',tag(sources['test/thoi-gian.js'])+tag(sources['test/ke-hoach-lich.js'])+tag(sources['test/bo-hoi-quy-phat-hanh.js'])+'</body>');
const runs=[];window.releaseEvidence={commit,hashes,runs,notes:'Mạng giả, CSP connect-src none, Storage RAM, IndexedDB namespace thử riêng xóa sau mỗi lượt. Ca tự ép adapter được giữ nguyên.'};
for(const provider of ['gemini','gemini','openrouter','openrouter']){
document.getElementById('out').textContent=JSON.stringify(releaseEvidence,null,2)+'\nĐang chạy '+provider;
const f=document.createElement('iframe');f.width=414;f.height=896;f.setAttribute('sandbox','allow-scripts allow-same-origin');
const result=new Promise((resolve,reject)=>{const timer=setTimeout(()=>{window.removeEventListener('message',listener);reject(Error('Hết hạn '+provider))},120000);function listener(e){if(e.source!==f.contentWindow)return;if(e.data?.type==='release-result'){clearTimeout(timer);window.removeEventListener('message',listener);resolve(e.data.data)}else if(e.data?.type==='release-error'){clearTimeout(timer);window.removeEventListener('message',listener);reject(Error(e.data.message))}}window.addEventListener('message',listener)});
f.srcdoc=base.replace('<head>','<head>'+tag('window.__TEST_PROVIDER__='+JSON.stringify(provider)));document.body.appendChild(f);
const r=await result;r.run=runs.length+1;r.selectedProvider=provider;runs.push(r);
if([r,r.core,r.helper,r.integration].some(x=>x.fail)||r.mobile.overlap||r.mobile.overflow)throw Error('Có ca FAIL hoặc lỗi khung hẹp');f.remove();}
document.getElementById('out').textContent=JSON.stringify(releaseEvidence,null,2);const a=document.getElementById('download');a.href=URL.createObjectURL(new Blob([JSON.stringify(releaseEvidence,null,2)],{type:'application/json'}));a.download='ket-qua-hoi-quy-lich.json';a.hidden=false;
})().catch(e=>{document.getElementById('out').textContent+='\nLỖI: '+e.message;window.releaseError=e.message});
</script></html>
